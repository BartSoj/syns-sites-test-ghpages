name: Deploy site to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Copy the site without agent files
        run: rsync -a --exclude .git --exclude .github --exclude DESIGN.md --exclude AGENTS.md --exclude site.json ./ "$RUNNER_TEMP/public/"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/public
          include-hidden-files: true
      - id: deployment
        uses: actions/deploy-pages@v5
